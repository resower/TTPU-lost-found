# Three services built from the same image. They share one volume (the SQLite file
# and uploaded photos live in /data). web runs the migrations; bot and worker wait
# until web is healthy, so the database always exists before they start.

x-app: &app
  build: .
  env_file: .env
  environment:
    DATA_DIR: /data
  volumes:
    - data:/data
  restart: unless-stopped

services:
  web:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/login/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  bot:
    <<: *app
    command: python manage.py runbot
    depends_on:
      web:
        condition: service_healthy

  worker:
    <<: *app
    command: python manage.py runworker
    depends_on:
      web:
        condition: service_healthy

volumes:
  data:
